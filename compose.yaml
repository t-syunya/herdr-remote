services:
  herdr-remote:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    network_mode: host
    environment:
      DEV_HOST: 127.0.0.1
      DEV_PORT: ${WEB_TARGET_PORT:-5174}
      HERDR_RELAY_HOST: 127.0.0.1
      HERDR_RELAY_PORT: ${HERDR_RELAY_PORT:-18787}
      HERDR_RELAY_TOKEN: ${HERDR_RELAY_TOKEN:?Run make up to start the authenticated Herdr relay.}
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /workspace/apps/web/src
        - action: sync
          path: ./apps/web/index.html
          target: /workspace/apps/web/index.html
        - action: sync+restart
          path: ./apps/web/vite.config.ts
          target: /workspace/apps/web/vite.config.ts
        - action: sync
          path: ./apps/server/src
          target: /workspace/apps/server/src
        - action: rebuild
          path: ./packages
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/server/package.json
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/server/tsconfig.json
        - action: rebuild
          path: ./apps/web/tsconfig.app.json
        - action: rebuild
          path: ./apps/web/tsconfig.node.json
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./.dockerignore
        - action: rebuild
          path: ./Dockerfile
